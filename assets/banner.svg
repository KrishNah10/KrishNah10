<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="40%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Outer Border Frame with Gradient -->
  <rect x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Quantum / Neural Ambient Glow Orbs -->
  <circle cx="150" cy="90" r="140" fill="#38BDF8" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="270" r="160" fill="#818CF8" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="950" cy="80" r="110" fill="#34D399" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Tech Geometric Constellations / Neural Circuit Lines -->
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3,3">
    <line x1="80" y1="180" x2="220" y2="100" />
    <line x1="220" y1="100" x2="310" y2="160" />
    <line x1="310" y1="160" x2="220" y2="240" />
    <line x1="220" y1="240" x2="80" y2="180" />
    
    <line x1="940" y1="120" x2="1040" y2="70" />
    <line x1="1040" y1="70" x2="1120" y2="140" />
    <line x1="1120" y1="140" x2="1060" y2="220" />
    <line x1="1060" y1="220" x2="940" y2="120" />
    <line x1="1060" y1="220" x2="1140" y2="260" />
  </g>

  <!-- Quantum / Neural Node Dots -->
  <g fill="#38BDF8">
    <circle cx="80" cy="180" r="3.5" filter="url(#softGlow)" />
    <circle cx="220" cy="100" r="4" filter="url(#softGlow)" />
    <circle cx="310" cy="160" r="3" fill="#818CF8" />
    <circle cx="220" cy="240" r="3.5" fill="#34D399" />
  </g>
  <g fill="#818CF8">
    <circle cx="940" cy="120" r="3.5" />
    <circle cx="1040" cy="70" r="4" fill="#38BDF8" filter="url(#softGlow)" />
    <circle cx="1120" cy="140" r="3.5" fill="#34D399" />
    <circle cx="1060" cy="220" r="4" />
    <circle cx="1140" cy="260" r="3" fill="#38BDF8" />
  </g>

  <!-- Top Status Pill / Badge -->
  <g transform="translate(425, 42)">
    <rect width="350" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#34D399" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
      QUANTUM • AI/ML • FULL-STACK
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="3" filter="url(#softGlow)">
    KRISHNA
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="500" fill="#F1F5F9" letter-spacing="0.5">
    Architecting Intelligent Systems • Full-Stack &amp; Quantum Algorithms
  </text>

  <!-- Feature Pills / Specializations -->
  <g transform="translate(285, 250)">
    <!-- Pill 1: AI/ML -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#111827" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1" />
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">
        🧠 Deep Learning &amp; AI
      </text>
    </g>

    <!-- Pill 2: Quantum Computing -->
    <g transform="translate(200, 0)">
      <rect width="230" height="42" rx="10" fill="#111827" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1" />
      <text x="115" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">
        ⚛️ Quantum Technologies
      </text>
    </g>

    <!-- Pill 3: Full-Stack Systems -->
    <g transform="translate(450, 0)">
      <rect width="180" height="42" rx="10" fill="#111827" stroke="#34D399" stroke-opacity="0.5" stroke-width="1" />
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">
        ⚡ Modern Full-Stack
      </text>
    </g>
  </g>

  <!-- Quantum Dirac Bra-Ket Ambient Symbols in Background -->
  <text x="80" y="320" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#38BDF8" fill-opacity="0.2">|ψ⟩ = α|0⟩ + β|1⟩</text>
  <text x="1000" y="320" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#34D399" fill-opacity="0.2">H|0⟩ = (|0⟩+|1⟩)/√2</text>
</svg>
