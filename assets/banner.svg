<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cyberVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080512" />
      <stop offset="55%" stop-color="#030206" />
      <stop offset="100%" stop-color="#010003" />
    </radialGradient>

    <!-- Subtle Ambient Backdrop Atmosphere (Kept minimal and soft) -->
    <radialGradient id="cyanBackdropGlow" cx="22%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="magentaBackdropGlow" cx="78%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#FF007A" stop-opacity="0" />
    </radialGradient>

    <!-- Professional 3D Chiseled Gradients: Top-Left Specular Light to Rich Body -->
    <linearGradient id="cyan3DFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#CEFAFE" />
      <stop offset="65%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <linearGradient id="pink3DFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFE4E6" />
      <stop offset="65%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6B21A8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Standard Professional 3D Directional Drop-Shadow (One-Sided Light) -->
    <filter id="cyan3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#00E5FF" flood-opacity="0.38" />
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="pink3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#FF007A" flood-opacity="0.38" />
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Subtle Accent Filters for Small Graphical Nodes -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Perspective Grid Pattern -->
    <pattern id="dotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="1200" height="460" rx="20" fill="url(#cyberVignette)" />
  <rect width="1200" height="460" rx="20" fill="url(#dotGrid)" />

  <!-- Soft Ambient Volumetric Lighting -->
  <rect width="1200" height="460" rx="20" fill="url(#cyanBackdropGlow)" />
  <rect width="1200" height="460" rx="20" fill="url(#magentaBackdropGlow)" />

  <!-- Outer Precision Neon Trim -->
  <rect x="2" y="2" width="1196" height="456" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.4" />

  <!-- ================= RIGHT SIDE: QUANTUM & AI VISUALIZATION ================= -->
  <g transform="translate(860, 230)">
    <!-- Ambient Core Accent -->
    <circle cx="0" cy="0" r="140" fill="#FF007A" fill-opacity="0.04" />
    <circle cx="-30" cy="-20" r="100" fill="#00F0FF" fill-opacity="0.04" />

    <!-- Quantum Bloch Sphere Orbitals -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FF007A" stroke-opacity="0.25" stroke-dasharray="6,4" stroke-width="1.2" />
    
    <!-- Precision Inclined Quantum Rings -->
    <ellipse cx="0" cy="0" rx="140" ry="46" fill="none" stroke="#00F0FF" stroke-width="1.6" filter="url(#softGlow)" transform="rotate(-25)" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="140" ry="46" fill="none" stroke="#FF007A" stroke-width="1.6" filter="url(#softGlow)" transform="rotate(35)" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="140" ry="65" fill="none" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,6" transform="rotate(85)" />

    <!-- Quantum Axis & Dirac Coordinate Poles -->
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#E2E8F0" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#E2E8F0" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Poles: |0⟩ and |1⟩ -->
    <text x="0" y="-165" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00F0FF">|0⟩</text>
    <text x="0" y="180" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#FF007A">|1⟩</text>

    <!-- Superposition State Vector |ψ⟩ -->
    <line x1="0" y1="0" x2="82" y2="-90" stroke="#00F0FF" stroke-width="2.4" filter="url(#softGlow)" />
    <polygon points="82,-90 73,-81 85,-79" fill="#00F0FF" />
    <circle cx="82" cy="-90" r="4.5" fill="#FFFFFF" />
    <text x="96" y="-96" font-family="'Courier New', monospace" font-size="17" font-weight="bold" fill="#FFFFFF">|ψ⟩</text>

    <!-- AI / Neural Network Synaptic Mesh Overlay -->
    <g stroke-width="1.2" opacity="0.65">
      <line x1="-110" y1="-50" x2="-50" y2="-100" stroke="#00F0FF" stroke-opacity="0.6" />
      <line x1="-50" y1="-100" x2="40" y2="-80" stroke="#00F0FF" stroke-opacity="0.8" />
      <line x1="-110" y1="-50" x2="-40" y2="20" stroke="#FF007A" stroke-opacity="0.5" />
      <line x1="-40" y1="20" x2="50" y2="50" stroke="#FF007A" stroke-opacity="0.8" />
      <line x1="50" y1="50" x2="110" y2="30" stroke="#00F0FF" stroke-opacity="0.7" />
      <line x1="-40" y1="20" x2="30" y2="-30" stroke="#C084FC" stroke-opacity="0.6" stroke-dasharray="2,2" />
      <line x1="30" y1="-30" x2="100" y2="-60" stroke="#FF007A" stroke-opacity="0.7" />
      <line x1="-80" y1="90" x2="-20" y2="100" stroke="#00F0FF" stroke-opacity="0.5" />
      <line x1="-20" y1="100" x2="70" y2="90" stroke="#FF007A" stroke-opacity="0.6" />
    </g>

    <!-- Neural Synapse Nodes -->
    <circle cx="-110" cy="-50" r="4.5" fill="#00F0FF" />
    <circle cx="-50" cy="-100" r="5" fill="#FFFFFF" stroke="#00F0FF" stroke-width="2" />
    <circle cx="40" cy="-80" r="4.5" fill="#00F0FF" />
    <circle cx="-40" cy="20" r="5.5" fill="#FF007A" />
    <circle cx="30" cy="-30" r="4" fill="#C084FC" />
    <circle cx="50" cy="50" r="5.5" fill="#FFFFFF" stroke="#FF007A" stroke-width="2" />
    <circle cx="110" cy="30" r="4.5" fill="#00F0FF" />
    <circle cx="100" cy="-60" r="5" fill="#FF007A" />
    <circle cx="-80" cy="90" r="4" fill="#00F0FF" />
    <circle cx="-20" cy="100" r="4.5" fill="#FF007A" />
    <circle cx="70" cy="90" r="4" fill="#00F0FF" />

    <!-- Quantum Circuit Logic Gates Overlay -->
    <g transform="translate(-140, 130)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#334155" stroke-width="1.8" />
      <line x1="0" y1="28" x2="280" y2="28" stroke="#334155" stroke-width="1.8" />
      
      <!-- H Gate (Hadamard in Cyan) -->
      <g transform="translate(45, -12)">
        <rect width="24" height="24" rx="4" fill="#040208" stroke="#00F0FF" stroke-width="1.5" />
        <text x="12" y="17" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#00F0FF">H</text>
      </g>

      <!-- CNOT Control and Target in Pink -->
      <g transform="translate(130, 0)">
        <circle cx="0" cy="0" r="4" fill="#FF007A" />
        <line x1="0" y1="0" x2="0" y2="28" stroke="#FF007A" stroke-width="2" />
        <circle cx="0" cy="28" r="9" fill="#040208" stroke="#FF007A" stroke-width="1.6" />
        <line x1="-6" y1="28" x2="6" y2="28" stroke="#FF007A" stroke-width="1.5" />
        <line x1="0" y1="22" x2="0" y2="34" stroke="#FF007A" stroke-width="1.5" />
      </g>

      <!-- Rz Gate in Purple -->
      <g transform="translate(200, 16)">
        <rect width="26" height="24" rx="4" fill="#040208" stroke="#C084FC" stroke-width="1.5" />
        <text x="13" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#C084FC">Rz</text>
      </g>
    </g>

    <!-- Mathematical Quantum Dirac Equations Floating -->
    <text x="-160" y="-120" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00F0FF" fill-opacity="0.6">|ψ⟩ = α|0⟩ + β|1⟩</text>
    <text x="-15" y="-125" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FF007A" fill-opacity="0.55">|α|² + |β|² = 1</text>
    <text x="50" y="115" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00F0FF" fill-opacity="0.5">U = e^{-iHt/ℏ}</text>
  </g>

  <!-- ================= LEFT SIDE: BOLD TWO-TIER 3D CHISELED TYPOGRAPHY ================= -->
  <g transform="translate(75, 80)">

    <!-- Top Futuristic Kicker -->
    <g transform="translate(2, 0)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="12.5" font-weight="800" fill="#38BDF8" letter-spacing="4">
        A R C H I T E C T I N G   T O M O R R O W
      </text>
      <line x1="0" y1="12" x2="160" y2="12" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />
    </g>

    <!-- TIER 1: "KRISHNA" with Crisp Single-Side 3D Lighting & High Contrast -->
    <!-- Layer 1: Directional Depth Extrusion (Bottom-Right) -->
    <text x="3.5" y="113.5" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="900" fill="#042F38" letter-spacing="4">
      KRISHNA
    </text>
    <text x="2" y="112" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="900" fill="#083344" letter-spacing="4">
      KRISHNA
    </text>
    <!-- Layer 2: Razor-Sharp Chiseled Front Face with Directional One-Sided Highlight -->
    <text x="0" y="110" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="900" fill="url(#cyan3DFace)" letter-spacing="4" filter="url(#cyan3D)">
      KRISHNA
    </text>

    <!-- TIER 2: "PRIYA" with Crisp Single-Side 3D Lighting & High Contrast -->
    <!-- Layer 1: Directional Depth Extrusion (Bottom-Right) -->
    <text x="3.5" y="208.5" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="900" fill="#3B0716" letter-spacing="4">
      PRIYA
    </text>
    <text x="2" y="207" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="900" fill="#4C0519" letter-spacing="4">
      PRIYA
    </text>
    <!-- Layer 2: Razor-Sharp Chiseled Front Face with Directional One-Sided Highlight -->
    <text x="0" y="205" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="900" fill="url(#pink3DFace)" letter-spacing="4" filter="url(#pink3D)">
      PRIYA
    </text>

    <!-- Subtitle / Tagline -->
    <g transform="translate(2, 240)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#94A3B8" letter-spacing="2.5">
        WHERE <tspan fill="#00E5FF">INTELLIGENCE</tspan> MEETS <tspan fill="#FF007A">QUANTUM</tspan>
      </text>
    </g>

    <!-- Standard Precision Tech Badges (Crisp and clean) -->
    <g transform="translate(0, 275)">
      <!-- AI / Deep Learning Badge -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="6" fill="#0A0614" stroke="#00E5FF" stroke-opacity="0.8" stroke-width="1.2" />
        <text x="90" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" letter-spacing="1">
          🧠 AI &amp; DEEP LEARNING
        </text>
      </g>

      <!-- Quantum Tech Badge -->
      <g transform="translate(195, 0)">
        <rect width="200" height="36" rx="6" fill="#0A0614" stroke="#FF007A" stroke-opacity="0.8" stroke-width="1.2" />
        <text x="100" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFE4E6" letter-spacing="1">
          ⚛️ QUANTUM COMPUTING
        </text>
      </g>

      <!-- Full-Stack Engineering Badge -->
      <g transform="translate(410, 0)">
        <rect width="175" height="36" rx="6" fill="#0A0614" stroke="#C084FC" stroke-opacity="0.8" stroke-width="1.2" />
        <text x="87" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F3E8FF" letter-spacing="1">
          ⚡ FULL-STACK ARCH
        </text>
      </g>
    </g>

    <!-- Bottom Secondary Spaced Kicker -->
    <g transform="translate(2, 342)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="3.5">
        EXPLORE THE FUTURE &#8226; OPEN TO INNOVATION
      </text>
    </g>

  </g>

  <!-- Precision Corner Accents -->
  <g stroke="#00F0FF" stroke-width="1.4" opacity="0.5">
    <line x1="20" y1="20" x2="45" y2="20" />
    <line x1="20" y1="20" x2="20" y2="45" />
  </g>
  <g stroke="#FF007A" stroke-width="1.4" opacity="0.5">
    <line x1="1180" y1="440" x2="1155" y2="440" />
    <line x1="1180" y1="440" x2="1180" y2="415" />
  </g>
</svg>
